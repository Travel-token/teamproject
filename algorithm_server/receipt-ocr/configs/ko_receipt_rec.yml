# PP-OCRv4/v5 한국어 인식(rec) 파인튜닝
# base: PaddleOCR/configs/rec/PP-OCRv4/ch_PP-OCRv4_rec.yml 를 복사해 아래 항목만 수정
Global:
  use_gpu: true
  epoch_num: 60
  log_smooth_window: 20
  print_batch_step: 50
  save_model_dir: ./output/ko_receipt_rec
  save_epoch_step: 5
  eval_batch_step: [0, 2000]
  cal_metric_during_train: true
  # 한국어 사전학습 가중치에서 출발 (처음부터 학습 X)
  pretrained_model: ./pretrain/korean_PP-OCRv4_rec_train/best_accuracy
  checkpoints:
  save_inference_dir:
  use_visualdl: false
  infer_mode: false
  character_dict_path: ./data/korean_receipt_dict.txt
  max_text_length: 40
  use_space_char: true
  save_res_path: ./output/ko_receipt_rec/predicts.txt

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.0005      # 파인튜닝이므로 낮게. 성능 안 오르면 0.001
    warmup_epoch: 2
  regularizer:
    name: L2
    factor: 3.0e-05

Loss:
  name: CTCLoss

PostProcess:
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc

Train:
  dataset:
    name: SimpleDataSet
    data_dir: ./
    label_file_list:
      - ./data/rec/label_train.txt          # AI Hub 인쇄체
      - ./data/cord/rec/train_label.txt     # CORD crop (영수증 도메인)
      - ./data/synth/label_train.txt        # 합성 영수증(권장, README 참고)
    ratio_list: [0.6, 1.0, 1.0]
    transforms:
      - DecodeImage: { img_mode: BGR, channel_first: false }
      - RecConAug: { prob: 0.5, ext_data_num: 2, image_shape: [48, 320, 3] }
      - RecAug:
      - MultiLabelEncode:
      - RecResizeImg: { image_shape: [3, 48, 320] }
      - KeepKeys:
          keep_keys: [image, label_ctc, length]
  loader:
    shuffle: true
    batch_size_per_card: 128     # RTX 5090이면 128~192 가능
    drop_last: true
    num_workers: 8

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: ./
    label_file_list:
      - ./data/rec/label_val.txt
      - ./data/cord/rec/val_label.txt
    transforms:
      - DecodeImage: { img_mode: BGR, channel_first: false }
      - MultiLabelEncode:
      - RecResizeImg: { image_shape: [3, 48, 320] }
      - KeepKeys:
          keep_keys: [image, label_ctc, length]
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 128
    num_workers: 4
