services:
  receipt-ocr:
    build: .
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      OCR_API_KEY: ${OCR_API_KEY:?OCR_API_KEY is required}
    volumes:
      # OCR 모델 캐시를 컨테이너 밖에 저장 -> 재시작할 때마다 다시 다운로드하지 않음
      - paddle-cache:/app/.paddlex
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # PaddleOCR이 메모리를 꽤 씁니다. 2GB 미만이면 죽을 수 있습니다.
          memory: 4G

volumes:
  paddle-cache:
