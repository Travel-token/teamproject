spring.application.name=demo

# ============================================================
# MySQL 연결 설정 (서버가 창고에 전화 거는 법)
# ============================================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# 주소 해석: localhost의 3306번 문(MySQL 기본 포트)에 있는 traveltoken 창고
spring.datasource.url=jdbc:mysql://localhost:3306/traveltoken?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
# !!! 아래를 본인 MySQL 설치할 때 정한 비밀번호로 바꾸세요 !!!
spring.datasource.password=1234

# ============================================================
# MyBatis 설정
# ============================================================
# 작업 지시서(SQL이 적힌 XML)들이 어디 있는지 알려줌
# classpath: = src/main/resources 폴더를 가리키는 말
mybatis.mapper-locations=classpath:mapper/*.xml