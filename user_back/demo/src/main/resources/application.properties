spring.application.name=demo
jwt.secret-key=12345678901234567890123456789012345678901234567890
jwt.expiration-time=86400000


spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/travel_token?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&useSSL=false
spring.datasource.username=root
spring.datasource.password=1234

# MyBatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.default-fetch-size=200
mybatis.configuration.call-setters-on-nulls=true


logging.level.com.example.project=debug
logging.level.org.mybatis=debug

spring.devtools.restart.enabled=true

logging.level.org.springframework.security=TRACE


server.servlet.context-path=/api