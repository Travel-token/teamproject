spring.application.name=demo
jwt.secret-key=12345678901234567890123456789012345678901234567890
jwt.expiration-time=86400000


spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/travel_token?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234

# MyBatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.default-fetch-size=200
mybatis.configuration.call-setters-on-nulls=true


logging.level.com.example.project=debug
logging.level.org.mybatis=debug

spring.devtools.restart.enabled=true

logging.level.org.springframework.security=TRACE

# ===== OpenAI(GPT) 피드 캡션 연동 =====
# 실제 키 값은 여기 적지 말 것! 이 파일은 git으로 팀 전체에 공유된다.
# 로컬에서 GPT를 켜고 싶으면 아래 두 값을 코드에 적지 말고
# IntelliJ 실행 설정(Run/Debug Configurations > Environment variables)에만 넣는다.
#   OPENAI_API_KEY=sk-...
#   FEED_RECO_PROVIDER=openai
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o-mini}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}

# 캡션 생성 방식: template(기본값, 외부 호출 없음/무료) 또는 openai(GPT 실제 호출)
feed.reco.provider=${FEED_RECO_PROVIDER:template}
