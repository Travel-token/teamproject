spring.application.name=demo
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}

# Shared settings: authentication must not depend on an optional feature profile.
# A deployment-provided secret is mandatory; no shared development secret is embedded.
session.refresh-secret=${SESSION_REFRESH_SECRET:}
session.access-seconds=${SESSION_ACCESS_SECONDS:900}
session.refresh-days=${SESSION_REFRESH_DAYS:30}
auth.dev-login.enabled=${AUTH_DEV_LOGIN_ENABLED:false}
integrations.ocr.url=${OCR_SERVICE_URL:http://127.0.0.1:8001/ocr}
integrations.ocr.api-key=${OCR_API_KEY:}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:8082,http://127.0.0.1:8081,http://127.0.0.1:8082}
notifications.marketing-admin-ids=${MARKETING_ADMIN_IDS:}
notifications.marketing-admin-key=${MARKETING_ADMIN_KEY:}
jwt.secret-key=${JWT_SECRET_KEY:}
jwt.expiration-time=86400000


spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/travel_token?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:travel_app}
spring.datasource.password=${DB_PASSWORD:}

# MyBatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.default-fetch-size=200
mybatis.configuration.call-setters-on-nulls=true


logging.level.com.example.project=debug
logging.level.org.mybatis=debug

spring.devtools.restart.enabled=true

logging.level.org.springframework.security=TRACE

# 여행 사진 저장 위치
app.upload-dir=${APP_UPLOAD_DIR:C:/teamproject/uploads}

# 사진 업로드 제한
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Android integrations: enable only after applying db/manual/20260906_android_integrations.sql
integrations.payment-capture.enabled=${PAYMENT_CAPTURE_ENABLED:${INTEGRATIONS_PAYMENT_CAPTURE_ENABLED:false}}
integrations.push.enabled=${PUSH_ENABLED:${INTEGRATIONS_PUSH_ENABLED:false}}
integrations.expo.access-token=${EXPO_ACCESS_TOKEN:}

# Production OAuth (secrets stay on the server)
auth.oauth.public-base-url=${AUTH_OAUTH_PUBLIC_BASE_URL:}
auth.oauth.app-redirect-uri=${AUTH_OAUTH_APP_REDIRECT_URI:travelsettle://oauth}
auth.oauth.google.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
auth.oauth.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}
auth.oauth.kakao.client-id=${KAKAO_OAUTH_CLIENT_ID:}
auth.oauth.kakao.client-secret=${KAKAO_OAUTH_CLIENT_SECRET:}
auth.oauth.naver.client-id=${NAVER_OAUTH_CLIENT_ID:}
auth.oauth.naver.client-secret=${NAVER_OAUTH_CLIENT_SECRET:}
tour-api.service-key=${TOUR_API_SERVICE_KEY:}
tour-api.base-url=${TOUR_API_BASE_URL:https://apis.data.go.kr/B551011/KorService2}
tour-api.mobile-os=${TOUR_API_MOBILE_OS:AND}
tour-api.app-name=${TOUR_API_APP_NAME:TravelSettle}
recommendation.base-url=${RECOMMENDATION_BASE_URL:http://127.0.0.1:5050}
recommendation.api-key=${RECOMMENDATION_API_KEY:}
