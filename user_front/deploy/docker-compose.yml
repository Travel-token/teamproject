name: travel-settle

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Seoul
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  recommendation:
    build:
      context: ../..
      dockerfile: user_front/deploy/recommendation.Dockerfile
    restart: unless-stopped
    environment:
      RECOMMENDATION_API_KEY: ${RECOMMENDATION_API_KEY}
      RECOMMENDATION_DATA_DIR: /data/recommendation
      RECOMMENDATION_HOST: 0.0.0.0
      RECOMMENDATION_PORT: 5050
    volumes:
      - recommendation-data:/data/recommendation
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10

  ocr:
    build:
      context: ../..
      dockerfile: user_front/deploy/ocr.Dockerfile
    restart: unless-stopped
    environment:
      OCR_API_KEY: ${OCR_API_KEY}
    volumes:
      - ocr-models:/data/models
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'Authorization: Bearer '$$OCR_API_KEY http://127.0.0.1:8001/health >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s

  backend:
    build:
      context: ../..
      dockerfile: user_front/deploy/backend.Dockerfile
    restart: unless-stopped
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      SESSION_REFRESH_SECRET: ${SESSION_REFRESH_SECRET}
      APP_UPLOAD_DIR: /data/uploads
      OCR_SERVICE_URL: http://ocr:8001/ocr
      OCR_API_KEY: ${OCR_API_KEY}
      RECOMMENDATION_BASE_URL: http://recommendation:5050
      RECOMMENDATION_API_KEY: ${RECOMMENDATION_API_KEY}
      AUTH_OAUTH_PUBLIC_BASE_URL: ${AUTH_OAUTH_PUBLIC_BASE_URL}
      AUTH_OAUTH_APP_REDIRECT_URI: ${AUTH_OAUTH_APP_REDIRECT_URI}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      KAKAO_OAUTH_CLIENT_ID: ${KAKAO_OAUTH_CLIENT_ID}
      KAKAO_OAUTH_CLIENT_SECRET: ${KAKAO_OAUTH_CLIENT_SECRET}
      NAVER_OAUTH_CLIENT_ID: ${NAVER_OAUTH_CLIENT_ID}
      NAVER_OAUTH_CLIENT_SECRET: ${NAVER_OAUTH_CLIENT_SECRET}
      TOUR_API_SERVICE_KEY: ${TOUR_API_SERVICE_KEY}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN}
      MARKETING_ADMIN_IDS: ${MARKETING_ADMIN_IDS}
      MARKETING_ADMIN_KEY: ${MARKETING_ADMIN_KEY}
      PAYMENT_CAPTURE_ENABLED: ${PAYMENT_CAPTURE_ENABLED:-false}
      PUSH_ENABLED: ${PUSH_ENABLED:-true}
      AUTH_DEV_LOGIN_ENABLED: ${AUTH_DEV_LOGIN_ENABLED:-false}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      SPRING_DEVTOOLS_RESTART_ENABLED: "false"
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: INFO
    volumes:
      - uploads:/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
      recommendation:
        condition: service_healthy
      ocr:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 20s
      timeout: 8s
      retries: 15
      start_period: 60s

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql-data:
  recommendation-data:
  ocr-models:
  uploads:
  caddy-data:
  caddy-config:
